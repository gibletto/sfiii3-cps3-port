name: Release

# Builds the 3DS version (.3dsx and .cia) and the Windows version, and attaches their zips to the release. Run it by
# hand to build without a release, or with a tag to (re)attach the zips to that release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the zip to (empty to only build)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: devkitpro/devkitarm:20260610@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build python3 git
          test -f "$DEVKITPRO/portlibs/3ds/lib/libz.a" || { echo "3ds-zlib is missing from the image"; exit 1; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Build
        run: |
          cmake -G Ninja -B build-3ds -DCMAKE_TOOLCHAIN_FILE=port/cmake/3ds-native.cmake -DDEVKITPRO="$DEVKITPRO"
          ninja -C build-3ds sf3

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-3ds
          path: |
            build-3ds/sf3
            build-3ds/sf3.3dsx
          if-no-files-found: error
          retention-days: 7

  # makerom needs a newer glibc than the devkitPro image has, so the CIA is made on the runner itself
  package:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      name: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-3ds
          path: build-3ds

      - name: Get makerom and bannertool
        run: |
          mkdir -p tools-bin && cd tools-bin
          curl -fsSL -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          curl -fsSL -o bannertool.zip https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          sha256sum -c <<'SUMS'
          287b809dec064e0ad597e3d272c49ecb7eed41693d5ee6fef9d8a8aa24c2497e  makerom.zip
          69768596f836acb3e3aeaa66e47c6ba560dde813c6dfcd33c8afc25fe29b7524  bannertool.zip
          SUMS
          unzip -q makerom.zip makerom
          unzip -q -j bannertool.zip linux-x86_64/bannertool
          chmod +x makerom bannertool

      - name: Make the CIA
        # the same steps as ctr_create_cia in port/cmake/3ds-native.cmake
        run: |
          dir=port/ctr/cia
          tools-bin/bannertool makebanner -i $dir/banner.png -a $dir/banner.wav -o build-3ds/sf3.bnr
          tools-bin/bannertool makesmdh -s "SF III 3rd Strike" -l "Street Fighter III 3rd Strike (CPS3 port)" \
            -p "sfiii3-cps3-port" -i $dir/icon.png -o build-3ds/sf3.cia.smdh
          tools-bin/makerom -f cia -o build-3ds/sf3.cia -target t -exefslogo -elf build-3ds/sf3 \
            -rsf $dir/sf3.rsf -icon build-3ds/sf3.cia.smdh -banner build-3ds/sf3.bnr -DAPP_ROMFS=port/ctr/romfs

      - name: Package
        id: package
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="${TAG:-$(git rev-parse --short=7 HEAD)}"
          name="sfiii3-3ds-$version"
          dir="dist/$name"
          mkdir -p "$dir/sd/3ds" "$dir/sd/sf3/rom-data" "$dir/tools"
          cp build-3ds/sf3.3dsx "$dir/sd/3ds/"
          cp build-3ds/sf3.cia "$dir/"
          touch "$dir/sd/sf3/rom-data/PUT bios.bin cg.bin user5.bin HERE.txt"
          cp port/ctr/release/README.txt "$dir/"
          cp port/tools/prepare_rom.py games/sf3/tools/cps3rom.py "$dir/tools/"
          cp LICENSE "$dir/LICENSE.txt"
          cp NOTICE.md "$dir/NOTICE.md"
          (cd dist && zip -r -9 "$name.zip" "$name")
          (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}.zip
            dist/${{ steps.package.outputs.name }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

  # Windows: 32-bit (the game stores addresses in 32 bits), built with MSYS2's mingw32 toolchain
  pc:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW32
          update: false
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja
            mingw-w64-i686-SDL2
            mingw-w64-i686-zlib
            mingw-w64-i686-python
            zip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Build
        run: |
          cmake -G Ninja -B build -DCMAKE_C_COMPILER=gcc
          ninja -C build sf3

      - name: Package
        id: package
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="${TAG:-${GITHUB_SHA::7}}"
          name="sfiii3-windows-$version"
          dir="dist/$name"
          mkdir -p "$dir/roms" "$dir/tools"
          cp build/sf3.exe /mingw32/bin/SDL2.dll "$dir/"
          touch "$dir/roms/PUT sfiii3nr1.zip HERE.txt"
          cp port/sdl/release/README.txt "$dir/"
          cp port/tools/prepare_rom.py games/sf3/tools/cps3rom.py "$dir/tools/"
          cp LICENSE "$dir/LICENSE.txt"
          cp NOTICE.md "$dir/NOTICE.md"
          (cd dist && zip -r -9 "$name.zip" "$name")
          (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}.zip
            dist/${{ steps.package.outputs.name }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [package, pc]
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sfiii3-*
          merge-multiple: true
          path: assets

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" assets/* --clobber
